name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run verify:release
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGPRAPP }}
          projectId: sgprapp
      - name: Smoke test deployed preview
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.details_url }}
        run: curl --fail --location --retry 5 --retry-all-errors --silent --show-error --output /dev/null "$DEPLOY_URL"
